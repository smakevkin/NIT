<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="CSS/style.css">
    <script src="libs/d3.v7.js"></script>
    <script src="JavaScript/data.js"></script>
    <script src="JavaScript/table.js"></script>
    <script src="JavaScript/chart.js"></script>
    <script src="JavaScript/main.js"></script>
</head>
<body>
<div class="page-wrapper">
    <h3>Список самых высоких зданий</h3>

    <div class="settings-form">
        <p><strong>Значение по оси OX</strong></p>
        <label><input type="radio" name="axisX" value="Страна" checked> Страна</label>
        <label><input type="radio" name="axisX" value="Год"> Год</label>

        <p><strong>Значение по оси OY</strong></p>
        <label><input type="checkbox" id="chkMax" checked> Максимальная высота</label>
        <label><input type="checkbox" id="chkMin"> Минимальная высота</label>
        <div class="error-msg" id="errMsg">Выберите хотя бы одно значение по оси OY</div>

        <p><strong>Тип графика</strong>
            <select id="chartType">
                <option value="scatter">Точечная диаграмма</option>
                <option value="bar">Гистограмма</option>
            </select>
        </p>
        <button id="btnBuild">Построить</button>
    </div>

    <svg id="chart-svg"></svg>

    <button class="toggle-btn" id="btnToggle">Скрыть таблицу</button>

    <table id="build"></table>
</div>
</body>
</html>
