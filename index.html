<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="libs/d3.v7.js"></script>
</head>

<body>
    <div class="wrapper">
        <div class="controls">
            <h2>Настройка анимации</h2>

            <label for="duration">Время анимации (мс)</label>
            <input type="number" id="duration" value="1000" min="500" step="100" />

            <label for="scaleFrom">Начальный масштаб</label>
            <input type="number" id="scaleFrom" value="1" min="0.1" step="0.1" />

            <label for="scaleTo">Конечный масштаб</label>
            <input type="number" id="scaleTo" value="1" min="0.1" step="0.1" />

            <label for="rotation">Поворот (градусы)</label>
            <input type="number" id="rotation" value="0" step="5" />

            <div class="buttons">
                <button id="drawBtn">Нарисовать</button>
                <button id="animateBtn">Запустить анимацию</button>
                <button id="clearBtn">Очистить</button>
            </div>
        </div>

        <div class="canvas-box">
            <svg id="scene" width="620" height="620"></svg>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
