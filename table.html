<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Породы собак</title>
</head>

<body>
    <ul type="none">
        <li> <a href="index.html">Собачки</a></li>
        <li><a href="table.html">Список собачек</a></li>
    </ul>
    <hr>


    <!-- 🔹 ФИЛЬТР -->
    <div class="filter-section">
        <h3>Фильтр</h3>
        <label>Размер:
            <select id="filterSize">
                <option value="all">Все</option>
                <option value="маленький">маленький</option>
                <option value="средний">средний</option>
                <option value="большой">большой</option>
                <option value="гигантский">гигантский</option>
            </select>
        </label>

        <label>Тип шерсти:
            <select id="filterCoat">
                <option value="all">Все</option>
                <option value="короткая">короткая</option>
                <option value="длинная">длинная</option>
                <option value="кудрявая">кудрявая</option>
                <option value="средняя">средняя</option>
                <option value="жёсткая">жёсткая</option>
                <option value="без шерсти">без шерсти</option>
            </select>
        </label>

        <label>Назначение:
            <select id="filterPurpose">
                <option value="all">Все</option>
                <option value="компаньон">компаньон</option>
                <option value="охотничья">охотничья</option>
                <option value="служебная">служебная</option>
                <option value="охранная">охранная</option>
                <option value="пастушья">пастушья</option>
            </select>
        </label>
    </div>

    <!-- 🔹 СОРТИРОВКА (3 уровня) -->
    <div class="sort-section">
        <h3>Сортировка</h3>

        <div class="sort-level">
            <label>Уровень 1:
                <select id="sort1Field">
                    <option value="none">Нет</option>
                    <option value="name">Название</option>
                    <option value="size">Размер</option>
                    <option value="activity">Активность</option>
                </select>
                <select id="sort1Order">
                    <option value="asc">По возрастанию</option>
                    <option value="desc">По убыванию</option>
                </select>
            </label>
        </div>

        <div class="sort-level">
            <label>Уровень 2:
                <select id="sort2Field">
                    <option value="none">Нет</option>
                    <option value="name">Название</option>
                    <option value="size">Размер</option>
                    <option value="activity">Активность</option>
                </select>
                <select id="sort2Order">
                    <option value="asc">По возрастанию</option>
                    <option value="desc">По убыванию</option>
                </select>
            </label>
        </div>

        <div class="sort-level">
            <label>Уровень 3:
                <select id="sort3Field">
                    <option value="none">Нет</option>
                    <option value="name">Название</option>
                    <option value="size">Размер</option>
                    <option value="activity">Активность</option>
                </select>
                <select id="sort3Order">
                    <option value="asc">По возрастанию</option>
                    <option value="desc">По убыванию</option>
                </select>
            </label>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>№</th>
                <th>Название</th>
                <th>Размер</th>
                <th>Тип шерсти</th>
                <th>Назначение</th>
                <th>Активность</th>
                <th>Квартира</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <script src="data.js"></script>
    <script src="main.js"></script>
</body>

</html>
